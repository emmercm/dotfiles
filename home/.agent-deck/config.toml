# Agent Deck Configuration
# All options: https://github.com/asheshgoplani/agent-deck/blob/main/skills/agent-deck/references/config-reference.md

default_tool = "claude"
theme = "system"

[claude]
  dangerous_mode = false

[worktree]
  auto_cleanup = false

[global_search]
  enabled = true
  tier = "auto"
  recent_days = 90

[logs]
  max_size_mb = 10
  max_lines = 10000
  remove_orphans = true
  debug_compress = false

[mcp_pool]
  auto_start = false
  shutdown_on_exit = false
  fallback_to_stdio = true
  show_pool_status = false

[updates]
  auto_update = true
  check_enabled = true
  notify_in_cli = false

[preview]
  show_output = true
  show_analytics = false
  show_notes = false
  notes_output_split = 0.33

[experiments]
  date_prefix = false

[notifications]
  enabled = false

[conductor]
  heartbeat_interval = 0

[tmux]
  launch_in_user_scope = false

[system_stats]
  enabled = true
  refresh_seconds = 5
  format = "full"
  show = ["cpu", "ram"]

[ui]
  new_session_enter_advances = false

